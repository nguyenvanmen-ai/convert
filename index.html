<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển đổi PDF & Ảnh Giữ Nguyên Định Dạng (Docx, Excel, Text)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tesseract.js library (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- docx.js (Xuất file .docx chuyên nghiệp) -->
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
  <!-- SheetJS / xlsx (Xuất file .xlsx chuyên nghiệp) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Quill.js WYSIWYG Rich Text Editor -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

  <style>
    .drop-zone--over { border-color: #2563eb; background-color: #eff6ff; }
    .ql-editor { min-height: 350px; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl md:text-4xl font-bold text-slate-900">Trích Xuất PDF & Ảnh - Giữ Định Dạng Chuẩn</h1>
      <p class="text-slate-600">Tự động nhận diện cấu trúc, cột, bảng, khoảng cách & dòng để xuất file <b>DOCX</b> và <b>XLSX</b> chuẩn nhất</p>
    </header>

    <!-- Upload Area -->
    <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center bg-white shadow-sm hover:border-blue-400 transition cursor-pointer">
      <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden" />
      <div class="space-y-4">
        <div class="flex justify-center">
          <svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
        </div>
        <div>
          <p class="text-lg font-medium text-slate-800">Kéo thả tệp PDF hoặc Ảnh vào đây</p>
          <p class="text-sm text-slate-500 mt-1">Hỗ trợ file PDF (văn bản & bản scan), PNG, JPG, WEBP</p>
        </div>
        <p id="fileName" class="text-sm font-semibold text-blue-600 hidden"></p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div class="flex items-center space-x-3">
        <label for="language" class="text-sm font-medium">Ngôn ngữ OCR:</label>
        <select id="language" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="vie+eng" selected>Tiếng Việt + Tiếng Anh</option>
          <option value="vie">Chỉ Tiếng Việt</option>
          <option value="eng">Chỉ Tiếng Anh</option>
        </select>
      </div>

      <button id="convertBtn" disabled class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-medium px-6 py-2.5 rounded-lg transition shadow-sm flex items-center space-x-2">
        <span>Xử lý & Giữ Định Dạng</span>
      </button>
    </div>

    <!-- Progress Status -->
    <div id="statusContainer" class="hidden space-y-2">
      <div class="flex justify-between text-sm font-medium">
        <span id="statusText">Đang xử lý...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2.5">
        <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Editor & Output Area -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden space-y-0">
      <div class="flex flex-wrap justify-between items-center px-4 py-3 bg-slate-100 border-b border-slate-200 gap-2">
        <span class="font-medium text-sm text-slate-700">Xem trước & Chỉnh sửa Văn bản (Rich Text)</span>
        
        <!-- Nút tải file các định dạng -->
        <div class="flex items-center space-x-2">
          <button id="downloadDocxBtn" disabled class="bg-blue-700 hover:bg-blue-800 disabled:bg-slate-300 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition flex items-center space-x-1">
            <span>Tải Word (.DOCX)</span>
          </button>
          <button id="downloadXlsxBtn" disabled class="bg-emerald-700 hover:bg-emerald-800 disabled:bg-slate-300 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition flex items-center space-x-1">
            <span>Tải Excel (.XLSX)</span>
          </button>
          <button id="downloadTxtBtn" disabled class="bg-slate-700 hover:bg-slate-800 disabled:bg-slate-300 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition">
            <span>.TXT</span>
          </button>
        </div>
      </div>
      
      <!-- Container Trình soạn thảo Quill -->
      <div id="editor"></div>
    </div>

  </div>

  <script>
    // Cấu hình PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Khởi tạo Trình soạn thảo Soạn thảo Rich Text
    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          [{ 'align': [] }],
          ['clean']
        ]
      },
      placeholder: 'Nội dung trích xuất sẽ giữ nguyên cấu trúc tiêu đề, đoạn văn, danh sách và hiển thị tại đây...'
    });

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const convertBtn = document.getElementById('convertBtn');
    
    const downloadTxtBtn = document.getElementById('downloadTxtBtn');
    const downloadDocxBtn = document.getElementById('downloadDocxBtn');
    const downloadXlsxBtn = document.getElementById('downloadXlsxBtn');
    
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const languageSelect = document.getElementById('language');

    let selectedFile = null;
    let extractedStructuredData = []; // Lưu trữ dữ liệu cấu trúc theo từng trang/đoạn

    // Drag & Drop Handling
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('drop-zone--over');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('drop-zone--over');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      if (dt.files && dt.files[0]) handleFileSelect(dt.files[0]);
    });

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleFileSelect(e.target.files[0]);
    });

    function handleFileSelect(file) {
      selectedFile = file;
      fileName.textContent = `Tệp đã chọn: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
      fileName.classList.remove('hidden');
      convertBtn.disabled = false;
      quill.setText('');
      setDownloadButtonsState(true);
    }

    function setDownloadButtonsState(disabled) {
      downloadTxtBtn.disabled = disabled;
      downloadDocxBtn.disabled = disabled;
      downloadXlsxBtn.disabled = disabled;
    }

    function updateProgress(message, ratio) {
      statusContainer.classList.remove('hidden');
      statusText.textContent = message;
      const pct = Math.round(ratio * 100);
      progressBar.style.width = `${pct}%`;
      progressPercent.textContent = `${pct}%`;
    }

    // Xử lý Chuyển đổi chính
    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      convertBtn.disabled = true;
      setDownloadButtonsState(true);
      quill.setText('');
      extractedStructuredData = [];
      updateProgress('Đang phân tích tệp...', 0.05);

      try {
        const lang = languageSelect.value;

        if (selectedFile.type === 'application/pdf') {
          await processPdfStructured(selectedFile, lang);
        } else if (selectedFile.type.startsWith('image/')) {
          await processImageStructured(selectedFile, lang);
        }

        renderToEditor();
        setDownloadButtonsState(false);
        updateProgress('Hoàn thành trích xuất định dạng!', 1);
      } catch (err) {
        console.error(err);
        alert('Có lỗi xảy ra: ' + err.message);
        updateProgress('Thất bại', 0);
      } finally {
        convertBtn.disabled = false;
      }
    });

    // 1. Xử lý PDF với Tọa độ & Cấu trúc Dòng/Đoạn
    async function processPdfStructured(file, lang) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        updateProgress(`Phân tích trang PDF ${pageNum}/${pdf.numPages}...`, (pageNum - 1) / pdf.numPages);
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();

        if (textContent.items.length > 0) {
          // Trích xuất văn bản gốc kèm vị trí tọa độ (Y, X) để tái tạo dòng/bảng
          const lines = groupTextByLines(textContent.items);
          extractedStructuredData.push({ page: pageNum, lines: lines });
        } else {
          // Trang Scan -> Chạy OCR Tesseract
          updateProgress(`Chạy OCR cho trang scan ${pageNum}/${pdf.numPages}...`, (pageNum - 0.5) / pdf.numPages);
          const viewport = page.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;
          const ocrLines = await processImageWithTesseract(canvas, lang);
          extractedStructuredData.push({ page: pageNum, lines: ocrLines });
        }
      }
    }

    // 2. Gom nhóm văn bản theo Tọa độ Y (Sắp xếp từ trên xuống dưới, từ trái sang phải)
    function groupTextByLines(items) {
      const tolerance = 4; // Tọa độ Y chênh lệch nhỏ hơn 4px xem như cùng 1 dòng
      let lineMap = [];

      items.forEach(item => {
        if (!item.str.trim() && item.str !== ' ') return;
        const x = item.transform[4];
        const y = item.transform[5];
        const height = item.height || Math.abs(item.transform[3]) || 12;

        let foundLine = lineMap.find(l => Math.abs(l.y - y) < tolerance);
        if (foundLine) {
          foundLine.items.push({ x, text: item.str, height });
        } else {
          lineMap.push({ y, items: [{ x, text: item.str, height }] });
        }
      });

      // Sắp xếp các dòng từ TRÊN xuống DƯỚI (y giảm dần trong PDF)
      lineMap.sort((a, b) => b.y - a.y);

      // Sắp xếp các từ trong từng dòng từ TRÁI sang PHẢI (x tăng dần)
      return lineMap.map(line => {
        line.items.sort((a, b) => a.x - b.x);
        
        let fullLineText = '';
        let isTableCandidate = false;
        let cells = [];
        let currentCell = '';

        for (let i = 0; i < line.items.length; i++) {
          const curr = line.items[i];
          const prev = line.items[i - 1];

          if (prev) {
            const gap = curr.x - (prev.x + prev.text.length * 5);
            if (gap > 25) { // Khoảng cách lớn giữa các chữ -> Phân tách Cột/Bảng
              isTableCandidate = true;
              cells.push(currentCell.trim());
              currentCell = '';
            }
          }
          currentCell += curr.text + ' ';
          fullLineText += curr.text + ' ';
        }
        cells.push(currentCell.trim());

        const maxHeight = Math.max(...line.items.map(it => it.height));
        const isHeader = maxHeight > 15; // Cỡ chữ lớn -> Tiêu đề

        return {
          text: fullLineText.trim(),
          isHeader: isHeader,
          isTableCandidate: isTableCandidate && cells.length > 1,
          cells: cells.filter(c => c !== '')
        };
      });
    }

    // 3. Xử lý Ảnh bằng Tesseract OCR lấy cấu trúc Dòng
    async function processImageStructured(file, lang) {
      updateProgress('Đang chạy OCR nhận diện cấu trúc...', 0.2);
      const lines = await processImageWithTesseract(file, lang);
      extractedStructuredData.push({ page: 1, lines: lines });
    }

    async function processImageWithTesseract(imageSource, lang) {
      const worker = await Tesseract.createWorker(lang, 1, {
        logger: m => {
          if (m.status === 'recognizing text') {
            updateProgress(`Đang xử lý OCR...`, m.progress);
          }
        }
      });
      
      const res = await worker.recognize(imageSource);
      await worker.terminate();

      const lines = res.data.lines.map(line => {
        const text = line.text.trim();
        const parts = text.split(/\s{3,}|\t/); // Phân tách theo Tab hoặc khoảng trắng đệm dài
        return {
          text: text,
          isHeader: line.baseline && Math.abs(line.bbox.y1 - line.bbox.y0) > 22,
          isTableCandidate: parts.length > 1,
          cells: parts
        };
      });

      return lines;
    }

    // 4. Hiển thị kết quả lên Editor Quill với HTML định dạng chuẩn
    function renderToEditor() {
      let htmlContent = '';

      extractedStructuredData.forEach(pageData => {
        if (extractedStructuredData.length > 1) {
          htmlContent += `<p><strong>--- Trang ${pageData.page} ---</strong></p>`;
        }

        pageData.lines.forEach(line => {
          if (!line.text) return;

          if (line.isHeader) {
            htmlContent += `<h2><strong>${escapeHtml(line.text)}</strong></h2>`;
          } else if (line.isTableCandidate && line.cells.length > 1) {
            const formattedRow = line.cells.map(c => escapeHtml(c)).join(' &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; ');
            htmlContent += `<p><code>${formattedRow}</code></p>`;
          } else {
            htmlContent += `<p>${escapeHtml(line.text)}</p>`;
          }
        });
        htmlContent += '<p><br></p>';
      });

      quill.clipboard.dangerouslyPasteHTML(htmlContent);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 5. Tải File Word (.DOCX)
    downloadDocxBtn.addEventListener('click', async () => {
      const docParagraphs = [];

      extractedStructuredData.forEach(pageData => {
        if (extractedStructuredData.length > 1) {
          docParagraphs.push(
            new docx.Paragraph({
              children: [new docx.TextRun({ text: `--- Trang ${pageData.page} ---`, bold: true, color: "2563EB" })],
              spaceAfter: 200
            })
          );
        }

        pageData.lines.forEach(line => {
          if (!line.text) return;

          if (line.isHeader) {
            docParagraphs.push(
              new docx.Paragraph({
                text: line.text,
                heading: docx.HeadingLevel.HEADING_2,
                spaceBefore: 240,
                spaceAfter: 120
              })
            );
          } else if (line.isTableCandidate && line.cells.length > 1) {
            const cellRuns = line.cells.map(c => new docx.TextRun({ text: c + "  \t  ", bold: false }));
            docParagraphs.push(
              new docx.Paragraph({
                children: cellRuns,
                spaceAfter: 80
              })
            );
          } else {
            docParagraphs.push(
              new docx.Paragraph({
                children: [new docx.TextRun(line.text)],
                spaceAfter: 100
              })
            );
          }
        });
      });

      const doc = new docx.Document({
        sections: [{
          properties: {},
          children: docParagraphs
        }]
      });

      const blob = await docx.Packer.toBlob(doc);
      saveBlob(blob, `VanBan-Chuandinhdang-${Date.now()}.docx`);
    });

    // 6. Tải File Excel (.XLSX)
    downloadXlsxBtn.addEventListener('click', () => {
      const excelRows = [];

      extractedStructuredData.forEach(pageData => {
        pageData.lines.forEach(line => {
          if (!line.text) return;

          if (line.isTableCandidate && line.cells.length > 1) {
            excelRows.push(line.cells);
          } else {
            excelRows.push([line.text]);
          }
        });
      });

      const worksheet = XLSX.utils.aoa_to_sheet(excelRows);
      
      const colWidths = [];
      excelRows.forEach(row => {
        row.forEach((cell, colIdx) => {
          const len = cell ? cell.toString().length : 10;
          colWidths[colIdx] = Math.max(colWidths[colIdx] || 10, len + 3);
        });
      });
      worksheet['!cols'] = colWidths.map(w => ({ wch: w }));

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'KetQua_DinhDang');
      XLSX.writeFile(workbook, `BangData-Chuandinhdang-${Date.now()}.xlsx`);
    });

    // 7. Tải File Text (.TXT)
    downloadTxtBtn.addEventListener('click', () => {
      const text = quill.getText();
      saveBlob(new Blob([text], { type: 'text/plain;charset=utf-8' }), `VanBan-${Date.now()}.txt`);
    });

    function saveBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
