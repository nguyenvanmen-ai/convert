<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trích Xuất & Tải File Giữ Định Dạng Chuẩn</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tesseract.js (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- SheetJS cho Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- html-docx-js cho phép chuyển HTML trực tiếp sang Word giữ chuẩn CSS/Bố cục -->
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
  <!-- Quill Editor -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

  <style>
    .drop-zone--over { border-color: #2563eb; background-color: #eff6ff; }
    .ql-editor { min-height: 380px; font-family: 'Times New Roman', Times, serif; font-size: 16px; line-height: 1.5; }
    /* Định dạng xem trước dạng bảng */
    .ocr-table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    .ocr-table td, .ocr-table th { border: 1px solid #cbd5e1; padding: 6px 10px; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl md:text-4xl font-bold text-slate-900">Xử Lý & Xuất File Word/Excel Chuẩn Định Dạng</h1>
      <p class="text-slate-600">Trích xuất văn bản từ PDF/Ảnh, tự động tạo cấu trúc Đoạn, Bảng và Tiêu đề</p>
    </header>

    <!-- Upload Area -->
    <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center bg-white shadow-sm hover:border-blue-400 transition cursor-pointer">
      <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden" />
      <div class="space-y-4">
        <div class="flex justify-center">
          <svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
        </div>
        <div>
          <p class="text-lg font-medium text-slate-800">Kéo thả tệp PDF hoặc Ảnh vào đây</p>
          <p class="text-sm text-slate-500 mt-1">PDF văn bản, PDF scan, PNG, JPG, WEBP</p>
        </div>
        <p id="fileName" class="text-sm font-semibold text-blue-600 hidden"></p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div class="flex items-center space-x-3">
        <label for="language" class="text-sm font-medium">Ngôn ngữ OCR:</label>
        <select id="language" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="vie+eng" selected>Tiếng Việt + Tiếng Anh</option>
          <option value="vie">Chỉ Tiếng Việt</option>
          <option value="eng">Chỉ Tiếng Anh</option>
        </select>
      </div>

      <button id="convertBtn" disabled class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-medium px-6 py-2.5 rounded-lg transition shadow-sm">
        Bắt đầu xử lý
      </button>
    </div>

    <!-- Progress Status -->
    <div id="statusContainer" class="hidden space-y-2">
      <div class="flex justify-between text-sm font-medium">
        <span id="statusText">Đang xử lý...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2.5">
        <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Editor & Output Area -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden space-y-0">
      <div class="flex flex-wrap justify-between items-center px-4 py-3 bg-slate-100 border-b border-slate-200 gap-2">
        <span class="font-medium text-sm text-slate-700">Xem trước định dạng (Có thể chỉnh sửa trực tiếp)</span>
        
        <!-- Nút tải file -->
        <div class="flex items-center space-x-2">
          <button id="downloadDocxBtn" disabled class="bg-blue-700 hover:bg-blue-800 disabled:bg-slate-300 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">
            Tải Word (.DOCX)
          </button>
          <button id="downloadXlsxBtn" disabled class="bg-emerald-700 hover:bg-emerald-800 disabled:bg-slate-300 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">
            Tải Excel (.XLSX)
          </button>
          <button id="downloadTxtBtn" disabled class="bg-slate-700 hover:bg-slate-800 disabled:bg-slate-300 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition">
            .TXT
          </button>
        </div>
      </div>
      
      <div id="editor"></div>
    </div>

  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, 3, false] }],
          ['bold', 'italic', 'underline'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          [{ 'align': [] }],
          ['clean']
        ]
      },
      placeholder: 'Nội dung định dạng sẽ hiển thị ở đây...'
    });

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const convertBtn = document.getElementById('convertBtn');
    
    const downloadTxtBtn = document.getElementById('downloadTxtBtn');
    const downloadDocxBtn = document.getElementById('downloadDocxBtn');
    const downloadXlsxBtn = document.getElementById('downloadXlsxBtn');
    
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const languageSelect = document.getElementById('language');

    let selectedFile = null;
    let rawStructuredLines = [];

    // Drag & drop handlers
    ['dragenter', 'dragover'].forEach(eName => {
      dropZone.addEventListener(eName, (e) => { e.preventDefault(); dropZone.classList.add('drop-zone--over'); });
    });
    ['dragleave', 'drop'].forEach(eName => {
      dropZone.addEventListener(eName, (e) => { e.preventDefault(); dropZone.classList.remove('drop-zone--over'); });
    });
    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
    });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleFileSelect(e.target.files[0]);
    });

    function handleFileSelect(file) {
      selectedFile = file;
      fileName.textContent = `Tệp đã chọn: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
      fileName.classList.remove('hidden');
      convertBtn.disabled = false;
      quill.setText('');
      setDownloadButtonsState(true);
    }

    function setDownloadButtonsState(disabled) {
      downloadTxtBtn.disabled = disabled;
      downloadDocxBtn.disabled = disabled;
      downloadXlsxBtn.disabled = disabled;
    }

    function updateProgress(message, ratio) {
      statusContainer.classList.remove('hidden');
      statusText.textContent = message;
      const pct = Math.round(ratio * 100);
      progressBar.style.width = `${pct}%`;
      progressPercent.textContent = `${pct}%`;
    }

    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      convertBtn.disabled = true;
      setDownloadButtonsState(true);
      quill.setText('');
      rawStructuredLines = [];
      updateProgress('Đang phân tích định dạng...', 0.05);

      try {
        const lang = languageSelect.value;
        if (selectedFile.type === 'application/pdf') {
          await processPdf(selectedFile, lang);
        } else {
          await processImage(selectedFile, lang);
        }
        renderFormattedContent();
        setDownloadButtonsState(false);
        updateProgress('Hoàn thành!', 1);
      } catch (err) {
        console.error(err);
        alert('Lỗi xử lý: ' + err.message);
        updateProgress('Thất bại', 0);
      } finally {
        convertBtn.disabled = false;
      }
    });

    async function processPdf(file, lang) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      for (let p = 1; p <= pdf.numPages; p++) {
        updateProgress(`Đang trích xuất trang ${p}/${pdf.numPages}...`, (p - 1) / pdf.numPages);
        const page = await pdf.getPage(p);
        const textContent = await page.getTextContent();

        if (textContent.items.length > 0) {
          const lines = parsePdfLines(textContent.items);
          rawStructuredLines.push(...lines);
        } else {
          const viewport = page.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
          const ocrLines = await runTesseract(canvas, lang);
          rawStructuredLines.push(...ocrLines);
        }
      }
    }

    function parsePdfLines(items) {
      const lineMap = [];
      const tolerance = 5;

      items.forEach(item => {
        if (!item.str.trim()) return;
        const x = item.transform[4];
        const y = item.transform[5];
        const height = Math.abs(item.transform[3]) || 12;

        let line = lineMap.find(l => Math.abs(l.y - y) < tolerance);
        if (line) {
          line.items.push({ x, text: item.str, height });
        } else {
          lineMap.push({ y, items: [{ x, text: item.str, height }] });
        }
      });

      lineMap.sort((a, b) => b.y - a.y);

      return lineMap.map(l => {
        l.items.sort((a, b) => a.x - b.x);
        let fullStr = '';
        let cells = [];
        let curCell = '';

        for (let i = 0; i < l.items.length; i++) {
          const curr = l.items[i];
          const prev = l.items[i - 1];

          if (prev && (curr.x - (prev.x + prev.text.length * 5)) > 20) {
            cells.push(curCell.trim());
            curCell = '';
          }
          curCell += curr.text + ' ';
          fullStr += curr.text + ' ';
        }
        cells.push(curCell.trim());

        const maxHeight = Math.max(...l.items.map(it => it.height));
        return {
          text: fullStr.trim(),
          isHeader: maxHeight > 14,
          isTable: cells.length > 1,
          cells: cells.filter(c => c !== '')
        };
      });
    }

    async function processImage(file, lang) {
      updateProgress('Đang quét OCR...', 0.2);
      const lines = await runTesseract(file, lang);
      rawStructuredLines.push(...lines);
    }

    async function runTesseract(source, lang) {
      const worker = await Tesseract.createWorker(lang, 1);
      const res = await worker.recognize(source);
      await worker.terminate();

      return res.data.lines.map(l => {
        const text = l.text.trim();
        const parts = text.split(/\s{3,}|\t/);
        return {
          text: text,
          isHeader: lineIsHeader(l),
          isTable: parts.length > 1,
          cells: parts
        };
      });
    }

    function lineIsHeader(line) {
      return line.baseline && Math.abs(line.bbox.y1 - line.bbox.y0) > 20;
    }

    function renderFormattedContent() {
      let html = '';
      let inTable = false;

      rawStructuredLines.forEach(line => {
        if (!line.text) return;

        if (line.isTable && line.cells.length > 1) {
          if (!inTable) {
            html += '<table class="ocr-table"><tbody>';
            inTable = true;
          }
          html += '<tr>' + line.cells.map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>';
        } else {
          if (inTable) {
            html += '</tbody></table>';
            inTable = false;
          }
          if (line.isHeader) {
            html += `<h2><strong>${escapeHtml(line.text)}</strong></h2>`;
          } else {
            html += `<p>${escapeHtml(line.text)}</p>`;
          }
        }
      });

      if (inTable) html += '</tbody></table>';

      quill.clipboard.dangerouslyPasteHTML(html);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Tải file DOCX (Giữ nguyên Bảng, Font chữ và Tiêu đề như hiển thị)
    downloadDocxBtn.addEventListener('click', () => {
      const htmlContent = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <style>
            body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.3; }
            h2 { font-size: 16pt; font-weight: bold; color: #1e293b; }
            table { border-collapse: collapse; width: 100%; margin-top: 10px; margin-bottom: 10px; }
            td, th { border: 1px solid #000; padding: 5px 8px; font-size: 11pt; }
          </style>
        </head>
        <body>
          ${quill.root.innerHTML}
        </body>
        </html>
      `;

      const converted = htmlDocx.asBlob(htmlContent);
      saveBlob(converted, `VanBan-DinhDang-${Date.now()}.docx`);
    });

    // Tải file XLSX (Tự động bóc tách từng cột vào ô Excel)
    downloadXlsxBtn.addEventListener('click', () => {
      const rows = [];
      rawStructuredLines.forEach(l => {
        if (l.isTable && l.cells.length > 1) {
          rows.push(l.cells);
        } else if (l.text) {
          rows.push([l.text]);
        }
      });

      const worksheet = XLSX.utils.aoa_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'DuLieu');
      XLSX.writeFile(workbook, `DuLieu-Excel-${Date.now()}.xlsx`);
    });

    downloadTxtBtn.addEventListener('click', () => {
      saveBlob(new Blob([quill.getText()], { type: 'text/plain;charset=utf-8' }), `VanBan-${Date.now()}.txt`);
    });

    function saveBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
