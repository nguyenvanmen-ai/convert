<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trích Xuất & Tải File Giữ Định Dạng Chuẩn</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tesseract.js (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- SheetJS cho Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- docx.js: tạo file Word CHUẨN OOXML thật sự (thay cho html-docx-js hay bể khung / lỗi font).
       LƯU Ý: phải dùng bản UMD (index.umd.js) thì mới tạo biến toàn cục `docx` khi nhúng
       bằng thẻ <script> thường; bản build/index.js là ESM nên không tạo global, gây lỗi
       "docx is not defined". -->
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <!-- Quill Editor -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

  <style>
    .drop-zone--over { border-color: #2563eb; background-color: #eff6ff; }
    .ql-editor { min-height: 380px; font-family: 'Times New Roman', Times, serif; font-size: 16px; line-height: 1.5; }
    .ocr-table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    .ocr-table td, .ocr-table th { border: 1px solid #cbd5e1; padding: 6px 10px; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">

    <header class="text-center space-y-2">
      <h1 class="text-3xl md:text-4xl font-bold text-slate-900">Xử Lý & Xuất File Word/Excel Chuẩn Định Dạng</h1>
      <p class="text-slate-600">Trích xuất văn bản từ PDF/Ảnh, tự động tạo cấu trúc Đoạn, Bảng và Tiêu đề</p>
    </header>

    <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center bg-white shadow-sm hover:border-blue-400 transition cursor-pointer">
      <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden" />
      <div class="space-y-4">
        <div class="flex justify-center">
          <svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
        </div>
        <div>
          <p class="text-lg font-medium text-slate-800">Kéo thả tệp PDF hoặc Ảnh vào đây</p>
          <p class="text-sm text-slate-500 mt-1">PDF văn bản, PDF scan, PNG, JPG, WEBP</p>
        </div>
        <p id="fileName" class="text-sm font-semibold text-blue-600 hidden"></p>
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div class="flex flex-wrap items-center gap-4">
        <div class="flex items-center space-x-3">
          <label for="language" class="text-sm font-medium">Ngôn ngữ OCR:</label>
          <select id="language" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="vie+eng" selected>Tiếng Việt + Tiếng Anh</option>
            <option value="vie">Chỉ Tiếng Việt</option>
            <option value="eng">Chỉ Tiếng Anh</option>
          </select>
        </div>

        <div class="flex items-center space-x-3">
          <label for="docType" class="text-sm font-medium">Kiểu nội dung nguồn:</label>
          <select id="docType" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="auto" selected>Tự động nhận diện</option>
            <option value="text">Văn bản / Báo cáo (ít hoặc không có bảng)</option>
            <option value="table">Biểu mẫu / Bảng biểu (nhiều bảng, dữ liệu dạng lưới)</option>
          </select>
        </div>
      </div>

      <button id="convertBtn" disabled class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-medium px-6 py-2.5 rounded-lg transition shadow-sm">
        Bắt đầu xử lý
      </button>
    </div>

    <div id="statusContainer" class="hidden space-y-2">
      <div class="flex justify-between text-sm font-medium">
        <span id="statusText">Đang xử lý...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2.5">
        <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden space-y-0">
      <div class="flex flex-wrap justify-between items-center px-4 py-3 bg-slate-100 border-b border-slate-200 gap-2">
        <span class="font-medium text-sm text-slate-700">Xem trước định dạng (Có thể chỉnh sửa trực tiếp)</span>

        <div class="flex items-center space-x-2">
          <button id="downloadDocxBtn" disabled class="bg-blue-700 hover:bg-blue-800 disabled:bg-slate-300 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">
            Tải Word (.DOCX)
          </button>
          <button id="downloadXlsxBtn" disabled class="bg-emerald-700 hover:bg-emerald-800 disabled:bg-slate-300 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">
            Tải Excel (.XLSX)
          </button>
          <button id="downloadTxtBtn" disabled class="bg-slate-700 hover:bg-slate-800 disabled:bg-slate-300 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition">
            .TXT
          </button>
        </div>
      </div>

      <div id="editor"></div>
    </div>

  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, 3, false] }],
          ['bold', 'italic', 'underline'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          [{ 'align': [] }],
          ['clean']
        ]
      },
      placeholder: 'Nội dung định dạng sẽ hiển thị ở đây...'
    });

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const convertBtn = document.getElementById('convertBtn');

    const downloadTxtBtn = document.getElementById('downloadTxtBtn');
    const downloadDocxBtn = document.getElementById('downloadDocxBtn');
    const downloadXlsxBtn = document.getElementById('downloadXlsxBtn');

    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const languageSelect = document.getElementById('language');
    const docTypeSelect = document.getElementById('docType');

    let selectedFile = null;
    let rawStructuredLines = [];

    // ---------- Drag & drop ----------
    ['dragenter', 'dragover'].forEach(eName => {
      dropZone.addEventListener(eName, (e) => { e.preventDefault(); dropZone.classList.add('drop-zone--over'); });
    });
    ['dragleave', 'drop'].forEach(eName => {
      dropZone.addEventListener(eName, (e) => { e.preventDefault(); dropZone.classList.remove('drop-zone--over'); });
    });
    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
    });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleFileSelect(e.target.files[0]);
    });

    function handleFileSelect(file) {
      selectedFile = file;
      fileName.textContent = `Tệp đã chọn: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
      fileName.classList.remove('hidden');
      convertBtn.disabled = false;
      quill.setText('');
      setDownloadButtonsState(true);
    }

    function setDownloadButtonsState(disabled) {
      downloadTxtBtn.disabled = disabled;
      downloadDocxBtn.disabled = disabled;
      downloadXlsxBtn.disabled = disabled;
    }

    function updateProgress(message, ratio) {
      statusContainer.classList.remove('hidden');
      statusText.textContent = message;
      const pct = Math.round(ratio * 100);
      progressBar.style.width = `${pct}%`;
      progressPercent.textContent = `${pct}%`;
    }

    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      convertBtn.disabled = true;
      setDownloadButtonsState(true);
      quill.setText('');
      rawStructuredLines = [];
      updateProgress('Đang phân tích định dạng...', 0.05);

      try {
        const lang = languageSelect.value;
        const docType = docTypeSelect.value; // 'auto' | 'text' | 'table'
        if (selectedFile.type === 'application/pdf') {
          await processPdf(selectedFile, lang);
        } else {
          await processImage(selectedFile, lang);
        }

        classifyHeaders(rawStructuredLines);
        smoothTableDetection(rawStructuredLines, docType);
        rawStructuredLines = rebuildTableBlocks(rawStructuredLines, docType);

        renderFormattedContent();
        setDownloadButtonsState(false);
        updateProgress('Hoàn thành!', 1);
      } catch (err) {
        console.error(err);
        alert('Lỗi xử lý: ' + err.message);
        updateProgress('Thất bại', 0);
      } finally {
        convertBtn.disabled = false;
      }
    });

    // ---------- Trích xuất PDF ----------
    async function processPdf(file, lang) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      for (let p = 1; p <= pdf.numPages; p++) {
        updateProgress(`Đang trích xuất trang ${p}/${pdf.numPages}...`, (p - 1) / pdf.numPages);
        const page = await pdf.getPage(p);
        const textContent = await page.getTextContent();

        if (textContent.items.length > 0) {
          const lines = parsePdfLines(textContent.items);
          rawStructuredLines.push(...lines);
        } else {
          const viewport = page.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
          const ocrLines = await runTesseract(canvas, lang);
          rawStructuredLines.push(...ocrLines);
        }
      }
    }

    function parsePdfLines(items) {
      const lineMap = [];
      const tolerance = 5;

      items.forEach(item => {
        // Chỉ bỏ qua item thực sự rỗng, KHÔNG bỏ qua item chỉ chứa khoảng trắng
        // (PDF.js thường phát ra khoảng trắng như một item riêng - bỏ nó đi làm mất
        // thông tin ranh giới từ, khiến việc ghép chữ dựa vào khoảng cách bị sai).
        if (item.str === '') return;
        const x = item.transform[4];
        const y = item.transform[5];
        const height = Math.abs(item.transform[3]) || 12;
        // pdf.js cung cấp sẵn item.width (đơn vị PDF). Nếu thiếu, ước lượng dự phòng.
        const width = (typeof item.width === 'number' && item.width > 0)
          ? item.width
          : item.str.length * height * 0.5;

        let line = lineMap.find(l => Math.abs(l.y - y) < tolerance);
        if (line) {
          line.items.push({ x, text: item.str, height, width });
        } else {
          lineMap.push({ y, items: [{ x, text: item.str, height, width }] });
        }
      });

      lineMap.sort((a, b) => b.y - a.y);

      return lineMap.map(l => {
        l.items.sort((a, b) => a.x - b.x);
        let fullStr = '';
        let cells = [];
        let curCell = '';

        for (let i = 0; i < l.items.length; i++) {
          const curr = l.items[i];
          const prev = l.items[i - 1];

          if (prev) {
            const gap = curr.x - (prev.x + prev.width);
            const refHeight = Math.max(curr.height, prev.height) || 12;
            const columnGapThreshold = refHeight * 1.8; // khoảng cách lớn => sang cột khác (bảng)
            const spaceThreshold = refHeight * 0.22;     // khoảng cách vừa => có dấu cách giữa 2 từ

            if (gap > columnGapThreshold) {
              cells.push(curCell.trim());
              curCell = '';
              fullStr += ' ';
            } else if (gap > spaceThreshold) {
              curCell += ' ';
              fullStr += ' ';
            }
            // gap nhỏ hoặc âm: ký tự liền của cùng một từ (thường gặp với dấu thanh
            // tiếng Việt bị PDF tách thành nhiều item) => KHÔNG chèn khoảng trắng.
          }

          curCell += curr.text;
          fullStr += curr.text;
        }
        cells.push(curCell.trim());

        const maxHeight = Math.max(...l.items.map(it => it.height));
        return {
          text: fullStr.replace(/[ \t]+/g, ' ').trim(),
          rawHeight: maxHeight,     // dùng để phân loại tiêu đề sau (theo median toàn văn bản)
          isHeader: false,
          isTable: cells.length > 1,
          cells: cells.map(c => c.replace(/[ \t]+/g, ' ').trim()).filter(c => c !== ''),
          items: l.items    // giữ lại toạ độ gốc để dựng lại bảng theo cụm cột chung cho cả khối
        };
      });
    }

    async function processImage(file, lang) {
      updateProgress('Đang quét OCR...', 0.2);
      const lines = await runTesseract(file, lang);
      rawStructuredLines.push(...lines);
    }

    async function runTesseract(source, lang) {
      const worker = await Tesseract.createWorker(lang, 1);
      const res = await worker.recognize(source);
      await worker.terminate();

      return res.data.lines.map(l => {
        const text = l.text.trim();
        const parts = text.split(/\s{3,}|\t/);
        const h = l.bbox ? Math.abs(l.bbox.y1 - l.bbox.y0) : 12;
        return {
          text: text,
          rawHeight: h,
          isHeader: false,
          isTable: parts.length > 1,
          cells: parts
        };
      });
    }

    // ---------- Phân loại tiêu đề dựa trên chiều cao trung vị (tránh nhận nhầm hàng loạt) ----------
    function classifyHeaders(lines) {
      const heights = lines.map(l => l.rawHeight).filter(h => h > 0).sort((a, b) => a - b);
      if (heights.length === 0) return;
      const median = heights[Math.floor(heights.length / 2)];
      lines.forEach(l => {
        l.isHeader = l.rawHeight > median * 1.3 && l.text.length < 120;
      });
    }

    // ---------- Làm mượt phát hiện bảng ----------
    // docType điều chỉnh mức độ "tin tưởng" vào việc 1 dòng có phải là hàng bảng hay không:
    //  - 'text' : coi toàn bộ là văn bản thường, KHÔNG dựng bảng (tránh nhận nhầm bảng
    //             trong báo cáo/văn bản thuần, vốn hay có các dòng canh cột ngẫu nhiên).
    //  - 'table': tin tưởng gần như tuyệt đối vào phát hiện ban đầu, kể cả dòng đơn lẻ,
    //             vì biểu mẫu/bảng biểu thường có nhiều hàng chỉ 1 dòng (cặp khoá:giá trị).
    //  - 'auto' : như cũ - chỉ giữ là bảng nếu có ít nhất 2 dòng liên tiếp cùng cấu trúc cột.
    function smoothTableDetection(lines, docType = 'auto') {
      if (docType === 'text') {
        lines.forEach(l => { l.isTable = false; l.cells = [l.text]; });
        return lines;
      }
      if (docType === 'table') {
        return lines; // giữ nguyên isTable đã phát hiện, không lọc bớt dòng đơn lẻ
      }
      for (let i = 0; i < lines.length; i++) {
        if (!lines[i].isTable) continue;
        const prevOk = i > 0 && lines[i - 1].isTable;
        const nextOk = i < lines.length - 1 && lines[i + 1].isTable;
        if (!prevOk && !nextOk) {
          lines[i].isTable = false;
          lines[i].cells = [lines[i].text];
        }
      }
      return lines;
    }

    // ---------- Dựng lại cấu trúc bảng theo khối (khắc phục lệch cột / lẫn hàng) ----------
    // Vấn đề của cách tách cột "theo từng dòng riêng lẻ": mỗi dòng tự suy ra số cột
    // và vị trí cột của chính nó, nên khi 1 ô bị wrap xuống nhiều dòng hoặc căn lệch
    // nhẹ, các dòng sẽ ra số cột khác nhau => bảng bị lẫn hàng, sai cột.
    // Cách khắc phục: với MỖI KHỐI các dòng liên tiếp được đánh dấu isTable, ta:
    //   1) Gom toàn bộ toạ độ x nơi "bắt đầu 1 cụm chữ mới" trên tất cả các dòng của khối
    //   2) Gộp các toạ độ x gần nhau thành các "ranh giới cột" DÙNG CHUNG cho cả khối
    //      (chỉ giữ ranh giới nào lặp lại đủ nhiều lần để loại nhiễu)
    //   3) Gán lại từng item của từng dòng vào đúng cột theo ranh giới chung đó
    //   4) Dòng nào không có chữ ở cột đầu tiên (tức là phần chữ bị xuống dòng của ô
    //      phía trên) sẽ được NỐI vào đúng ô tương ứng của hàng ngay trước, thay vì
    //      tạo thành một hàng bảng mới.
    function rebuildTableBlocks(lines, docType = 'auto') {
      const result = [];
      let i = 0;
      while (i < lines.length) {
        if (!lines[i].isTable) { result.push(lines[i]); i++; continue; }
        let j = i;
        while (j < lines.length && lines[j].isTable) j++;
        const block = lines.slice(i, j);
        result.push(...reconstructTableBlock(block, docType));
        i = j;
      }
      return result;
    }

    function reconstructTableBlock(block, docType = 'auto') {
      // Chỉ áp dụng được với các dòng trích từ PDF văn bản (có toạ độ items gốc).
      // Dòng đến từ OCR ảnh không có toạ độ item chi tiết => giữ nguyên như cũ.
      if (!block.every(l => l.items && l.items.length)) return block;

      const refHeight = block.reduce((s, l) => s + l.rawHeight, 0) / block.length || 12;
      const columnGapThreshold = refHeight * 1.8;
      const spaceThreshold = refHeight * 0.22;

      // B1: thu thập toạ độ x bắt đầu của từng cụm chữ trên mỗi dòng
      const startXs = [];
      block.forEach(line => {
        const its = line.items;
        if (its.length) startXs.push(its[0].x);
        for (let k = 1; k < its.length; k++) {
          const gap = its[k].x - (its[k - 1].x + its[k - 1].width);
          if (gap > columnGapThreshold) startXs.push(its[k].x);
        }
      });
      if (startXs.length === 0) return block;

      // B2: gộp các toạ độ x gần nhau thành ranh giới cột dùng chung
      // 'table': lưới bảng biểu thường có nhiều cột hẹp, ô ngắn (1 dòng) => cần ranh giới
      //          sát nhau hơn và chấp nhận cột chỉ xuất hiện ở vài hàng.
      // 'text' / 'auto': văn bản/báo cáo => ranh giới cần lặp lại nhiều hơn mới tin cậy,
      //          tránh nhận nhầm các dòng văn xuôi canh lề ngẫu nhiên thành bảng nhiều cột.
      const clusterTolerance = docType === 'table' ? refHeight * 0.9 : refHeight * 1.2;
      const supportRatio = docType === 'table' ? 0.08 : 0.15;
      const minSupportFloor = docType === 'table' ? 1 : 2;

      startXs.sort((a, b) => a - b);
      const clusters = [];
      startXs.forEach(x => {
        const last = clusters[clusters.length - 1];
        if (last && x - (last.sum / last.count) < clusterTolerance) {
          last.sum += x; last.count++;
        } else {
          clusters.push({ sum: x, count: 1 });
        }
      });

      // Chỉ giữ ranh giới cột nào xuất hiện đủ nhiều lần (loại nhiễu do 1 dòng lệch bất thường)
      const minSupport = Math.max(minSupportFloor, Math.round(block.length * supportRatio));
      const boundaries = clusters
        .filter(c => c.count >= minSupport)
        .map(c => c.sum / c.count)
        .sort((a, b) => a - b);

      const numCols = boundaries.length;
      if (numCols <= 1) return block; // không đủ căn cứ để coi là bảng nhiều cột

      function colIndexOf(x) {
        let best = 0, bestDist = Infinity;
        boundaries.forEach((b, idx) => {
          const d = Math.abs(x - b);
          if (d < bestDist) { bestDist = d; best = idx; }
        });
        return best;
      }

      // B3: gán lại item của từng dòng vào đúng cột theo ranh giới chung
      const rows = block.map(line => {
        const cellsArr = new Array(numCols).fill('');
        let prevItem = null;
        let prevCol = -1;
        line.items.forEach(item => {
          const col = colIndexOf(item.x);
          let sep = '';
          if (prevItem && col === prevCol) {
            const gap = item.x - (prevItem.x + prevItem.width);
            if (gap > spaceThreshold) sep = ' ';
          } else if (cellsArr[col] !== '') {
            sep = ' ';
          }
          cellsArr[col] += sep + item.text;
          prevItem = item;
          prevCol = col;
        });
        return cellsArr.map(c => c.replace(/[ \t]+/g, ' ').trim());
      });

      // B4: gộp dòng "nối tiếp" (không có chữ ở cột đầu tiên) vào hàng ngay trước.
      // Ở chế độ 'table', mỗi dòng thường là 1 hàng độc lập thật sự (biểu mẫu key-value
      // dạng lưới đều), nên KHÔNG gộp để tránh mất hàng dữ liệu thật.
      let merged;
      if (docType === 'table') {
        merged = rows.map(r => r.slice());
      } else {
        merged = [];
        rows.forEach(cells => {
          const isContinuation = merged.length > 0 && cells[0] === '';
          if (isContinuation) {
            const prev = merged[merged.length - 1];
            cells.forEach((c, idx) => {
              if (c) prev[idx] = prev[idx] ? `${prev[idx]} ${c}` : c;
            });
          } else {
            merged.push(cells.slice());
          }
        });
      }

      return merged.map(cells => ({
        text: cells.filter(c => c !== '').join(' | '),
        rawHeight: refHeight,
        isHeader: false,
        isTable: true,
        cells // giữ đủ số cột kể cả ô rỗng để bảng không bị lệch khi xuất Word/Excel
      }));
    }

    function renderFormattedContent() {
      let html = '';
      let inTable = false;

      rawStructuredLines.forEach(line => {
        if (!line.text) return;

        if (line.isTable && line.cells.length > 1) {
          if (!inTable) {
            html += '<table class="ocr-table"><tbody>';
            inTable = true;
          }
          html += '<tr>' + line.cells.map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>';
        } else {
          if (inTable) {
            html += '</tbody></table>';
            inTable = false;
          }
          if (line.isHeader) {
            html += `<h2><strong>${escapeHtml(line.text)}</strong></h2>`;
          } else {
            html += `<p>${escapeHtml(line.text)}</p>`;
          }
        }
      });

      if (inTable) html += '</tbody></table>';

      quill.clipboard.dangerouslyPasteHTML(html);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // =========================================================================
    // TẢI FILE DOCX — dùng thư viện docx.js để dựng file .docx CHUẨN OOXML thật sự.
    // Cách này thay thế html-docx-js (vốn chỉ nhúng HTML vào khung MHTML, dễ vỡ
    // bảng và lỗi hiển thị font trong Word). Ở đây mỗi đoạn văn / tiêu đề / bảng
    // được dựng thành đối tượng Paragraph/Table thật của Word, và font được gán
    // rõ ràng (Times New Roman) cho từng run văn bản nên không bị lỗi font.
    // =========================================================================
    // Nếu vì lý do mạng/CDN mà thư viện docx.js chưa sẵn sàng, thử tải lại từ nguồn dự phòng.
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Không tải được thư viện từ ' + src));
        document.head.appendChild(s);
      });
    }

    async function ensureDocxLibLoaded() {
      if (typeof docx !== 'undefined' && docx.Document) return;
      const fallbackUrls = [
        'https://unpkg.com/docx@8.5.0/build/index.umd.js',
        'https://cdn.jsdelivr.net/npm/docx@8.6.0/build/index.umd.js'
      ];
      for (const url of fallbackUrls) {
        try {
          await loadScript(url);
          if (typeof docx !== 'undefined' && docx.Document) return;
        } catch (e) { /* thử URL kế tiếp */ }
      }
      if (typeof docx === 'undefined' || !docx.Document) {
        throw new Error('Không tải được thư viện tạo file Word (docx.js). Vui lòng kiểm tra kết nối mạng rồi tải lại trang.');
      }
    }

    downloadDocxBtn.addEventListener('click', async () => {
      downloadDocxBtn.disabled = true;
      const originalLabel = downloadDocxBtn.textContent;
      downloadDocxBtn.textContent = 'Đang tạo file...';
      try {
        await ensureDocxLibLoaded();
        const blocks = elementToDocxBlocks(quill.root);

        const doc = new docx.Document({
          styles: {
            default: {
              document: {
                run: { font: 'Times New Roman', size: 24 } // 12pt
              }
            }
          },
          sections: [{
            properties: {
              page: { margin: { top: 1134, bottom: 1134, left: 1134, right: 1134 } } // ~2cm lề
            },
            children: blocks.length ? blocks : [new docx.Paragraph({ children: [new docx.TextRun('')] })]
          }]
        });

        const blob = await docx.Packer.toBlob(doc);
        saveBlob(blob, `VanBan-DinhDang-${Date.now()}.docx`);
      } catch (err) {
        console.error(err);
        alert('Lỗi khi tạo file Word: ' + err.message);
      } finally {
        downloadDocxBtn.disabled = false;
        downloadDocxBtn.textContent = originalLabel;
      }
    });

    // Duyệt cây DOM của Quill (h1/h2/h3, p, ul/ol, table) và dựng thành các block docx.js
    function elementToDocxBlocks(rootEl) {
      const blocks = [];

      Array.from(rootEl.childNodes).forEach(node => {
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        const tag = node.tagName.toLowerCase();

        if (tag === 'h1' || tag === 'h2' || tag === 'h3') {
          const sizeMap = { h1: 32, h2: 28, h3: 26 }; // half-points: 16pt/14pt/13pt
          const size = sizeMap[tag];
          const runs = parseInlineRuns(node, { bold: true, size });
          blocks.push(new docx.Paragraph({
            children: runs.length ? runs : [new docx.TextRun({ text: node.textContent, bold: true, size, font: 'Times New Roman' })],
            spacing: { before: 240, after: 120 },
            alignment: getAlignment(node)
          }));

        } else if (tag === 'p') {
          const runs = parseInlineRuns(node, {});
          blocks.push(new docx.Paragraph({
            children: runs.length ? runs : [new docx.TextRun({ text: '', font: 'Times New Roman', size: 24 })],
            spacing: { after: 120 },
            alignment: getAlignment(node)
          }));

        } else if (tag === 'ul' || tag === 'ol') {
          let idx = 1;
          node.querySelectorAll(':scope > li').forEach(li => {
            const prefix = tag === 'ol' ? `${idx}. ` : '•  ';
            idx++;
            const runs = parseInlineRuns(li, {});
            blocks.push(new docx.Paragraph({
              children: [new docx.TextRun({ text: prefix, font: 'Times New Roman', size: 24 }), ...runs],
              indent: { left: 420 },
              spacing: { after: 80 }
            }));
          });

        } else if (tag === 'table') {
          const trList = Array.from(node.querySelectorAll(':scope > tbody > tr, :scope > tr'));
          if (trList.length === 0) return;

          const numCols = Math.max(...trList.map(tr => tr.querySelectorAll('td,th').length), 1);
          const colWidthPct = Math.floor(100 / numCols);

          const rows = trList.map(tr => {
            const cellsEls = Array.from(tr.querySelectorAll('td,th'));
            const cells = cellsEls.map(td => {
              const runs = parseInlineRuns(td, { size: 22 });
              return new docx.TableCell({
                width: { size: colWidthPct, type: docx.WidthType.PERCENTAGE },
                margins: { top: 80, bottom: 80, left: 100, right: 100 },
                children: [new docx.Paragraph({
                  children: runs.length ? runs : [new docx.TextRun({ text: '', font: 'Times New Roman', size: 22 })]
                })]
              });
            });
            // Đảm bảo mọi hàng có cùng số cột để bảng không bị lệch khung
            while (cells.length < numCols) {
              cells.push(new docx.TableCell({
                width: { size: colWidthPct, type: docx.WidthType.PERCENTAGE },
                children: [new docx.Paragraph({ children: [new docx.TextRun({ text: '', font: 'Times New Roman', size: 22 })] })]
              }));
            }
            return new docx.TableRow({ children: cells });
          });

          blocks.push(new docx.Table({
            rows,
            width: { size: 100, type: docx.WidthType.PERCENTAGE },
            borders: {
              top: { style: docx.BorderStyle.SINGLE, size: 4, color: '999999' },
              bottom: { style: docx.BorderStyle.SINGLE, size: 4, color: '999999' },
              left: { style: docx.BorderStyle.SINGLE, size: 4, color: '999999' },
              right: { style: docx.BorderStyle.SINGLE, size: 4, color: '999999' },
              insideHorizontal: { style: docx.BorderStyle.SINGLE, size: 4, color: '999999' },
              insideVertical: { style: docx.BorderStyle.SINGLE, size: 4, color: '999999' }
            }
          }));
          // khoảng cách sau bảng
          blocks.push(new docx.Paragraph({ children: [new docx.TextRun({ text: '', size: 12 })] }));

        } else {
          const text = node.textContent.trim();
          if (text) {
            blocks.push(new docx.Paragraph({
              children: [new docx.TextRun({ text, font: 'Times New Roman', size: 24 })],
              spacing: { after: 120 }
            }));
          }
        }
      });

      return blocks;
    }

    // Duyệt đệ quy các node con để giữ định dạng in đậm/nghiêng/gạch chân
    function parseInlineRuns(node, fmt) {
      let runs = [];
      node.childNodes.forEach(child => {
        if (child.nodeType === Node.TEXT_NODE) {
          const text = child.textContent;
          if (text) {
            runs.push(new docx.TextRun({
              text,
              bold: !!fmt.bold,
              italics: !!fmt.italic,
              underline: fmt.underline ? {} : undefined,
              font: 'Times New Roman',
              size: fmt.size || 24
            }));
          }
        } else if (child.nodeType === Node.ELEMENT_NODE) {
          const tag = child.tagName.toLowerCase();
          if (tag === 'br') {
            runs.push(new docx.TextRun({ text: '', break: 1 }));
            return;
          }
          const newFmt = Object.assign({}, fmt);
          if (tag === 'strong' || tag === 'b') newFmt.bold = true;
          if (tag === 'em' || tag === 'i') newFmt.italic = true;
          if (tag === 'u') newFmt.underline = true;
          runs = runs.concat(parseInlineRuns(child, newFmt));
        }
      });
      return runs;
    }

    function getAlignment(el) {
      if (el.classList.contains('ql-align-center')) return docx.AlignmentType.CENTER;
      if (el.classList.contains('ql-align-right')) return docx.AlignmentType.RIGHT;
      if (el.classList.contains('ql-align-justify')) return docx.AlignmentType.JUSTIFIED;
      return docx.AlignmentType.LEFT;
    }

    // =========================================================================
    // TẢI FILE XLSX — bóc tách từng cột vào ô Excel, tự căn độ rộng cột
    // để bảng không bị dồn chữ / lệch cột (UTF-8 tiếng Việt được SheetJS xử lý native).
    // =========================================================================
    downloadXlsxBtn.addEventListener('click', () => {
      const rows = [];
      rawStructuredLines.forEach(l => {
        if (l.isTable && l.cells.length > 1) {
          rows.push(l.cells);
        } else if (l.text) {
          rows.push([l.text]);
        }
      });

      if (rows.length === 0) {
        alert('Không có dữ liệu để xuất Excel.');
        return;
      }

      const worksheet = XLSX.utils.aoa_to_sheet(rows);

      // Tự động tính độ rộng cột dựa trên nội dung dài nhất mỗi cột
      const numCols = Math.max(...rows.map(r => r.length));
      const colWidths = [];
      for (let c = 0; c < numCols; c++) {
        let maxLen = 8;
        rows.forEach(r => {
          const cell = r[c];
          if (cell && String(cell).length > maxLen) maxLen = String(cell).length;
        });
        colWidths.push({ wch: Math.min(maxLen + 2, 60) });
      }
      worksheet['!cols'] = colWidths;

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'DuLieu');
      XLSX.writeFile(workbook, `DuLieu-Excel-${Date.now()}.xlsx`, { bookType: 'xlsx', type: 'binary' });
    });

    downloadTxtBtn.addEventListener('click', () => {
      saveBlob(new Blob([quill.getText()], { type: 'text/plain;charset=utf-8' }), `VanBan-${Date.now()}.txt`);
    });

    function saveBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
